name: Toolchain

on:
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/toolchain.yaml'
  push:
    branches: [master]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/toolchain.yaml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check --all-systems --no-build
      - run: nix develop --command shellcheck scripts/* tests/*.sh
      - run: nix develop --command bash tests/setup.sh
      - run: nix develop --command bash scripts/check-terraform-downloads
