name: 'Terraform (Grafana)'

on:
  push:
    branches:
      - master
    paths:
      - 'grafana/**'
      - '.github/workflows/grafana_apply_terraform.yaml'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: read
  pull-requests: write
jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: grafana

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: 'Apply Start Slack Notification'
        uses: kanade0404/slatify@v1.0.0
        with:
          type: success
          username: ${{ github.workflow }}
          icon_emoji: ':github:'
          job_name: '*Terraform (Grafana) Apply Start*'
          url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ secrets.SLACK_CHANNEL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.11.4
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format
        id: fmt
        run: terraform fmt -recursive -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: setup tfcmt
        env:
          TFCMT_VERSION: v4.7.1
        run: |
          wget "https://github.com/suzuki-shunsuke/tfcmt/releases/download/${TFCMT_VERSION}/tfcmt_linux_amd64.tar.gz" -O /tmp/tfcmt.tar.gz
          tar xzf /tmp/tfcmt.tar.gz -C /tmp
          mv /tmp/tfcmt /usr/local/bin
          tfcmt --version

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: tfcmt apply -- terraform apply -no-color -auto-approve

      - name: Slack Notification
        uses: kanade0404/slatify@v1.0.0
        if: always()
        with:
          type: ${{ job.status }}
          username: ${{ github.workflow }}
          icon_emoji: ':github:'
          job_name: '*Terraform (Grafana) Apply Result*'
          url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ secrets.SLACK_CHANNEL }}
