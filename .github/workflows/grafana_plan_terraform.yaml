name: 'Terraform (Grafana)'

on:
  pull_request:
    paths:
      - 'grafana/**'
      - '.github/workflows/grafana_plan_terraform.yaml'

permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    # GitHub Actions permissions can only be scoped at the workflow or job level
    # (not per step), so pull-requests: write is granted here at the job level
    # for the tfcmt PR comment step. GITHUB_TOKEN itself is further scoped to
    # just that step via its own env block below.
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: grafana

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 'Plan Start Slack Notification'
        uses: kanade0404/slatify@49d087e4b74ccac7a1f12db94932cb87f7e759a9 # v1.0.0
        with:
          type: success
          username: ${{ github.workflow }}
          icon_emoji: ':github:'
          job_name: '*Terraform (Grafana) Plan Start*'
          url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ secrets.SLACK_CHANNEL }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          workload_identity_provider: 'projects/137094135185/locations/global/workloadIdentityPools/gh-oidc-pool/providers/github-actions'
          service_account: 'github-actions@kanade0404.iam.gserviceaccount.com'

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5

      - name: OpenTofu Format
        id: fmt
        run: tofu fmt -recursive -check

      - name: OpenTofu Init
        id: init
        run: tofu init

      - name: OpenTofu Validate
        id: validate
        run: tofu validate -no-color

      - name: setup tfcmt
        env:
          TFCMT_VERSION: v4.7.1
          TFCMT_SHA256: 9ae464a3e33bc7d9ce61fe6aaf70fbeb5320bfad5fb4045c424cd735e9afffcb
        run: |
          wget "https://github.com/suzuki-shunsuke/tfcmt/releases/download/${TFCMT_VERSION}/tfcmt_linux_amd64.tar.gz" -O /tmp/tfcmt.tar.gz
          echo "${TFCMT_SHA256}  /tmp/tfcmt.tar.gz" | sha256sum -c -
          tar xzf /tmp/tfcmt.tar.gz -C /tmp
          mv /tmp/tfcmt /usr/local/bin
          tfcmt --version

      - name: OpenTofu Plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
        run: tfcmt plan -patch -- tofu plan -no-color -input=false

      - name: Slack Notification
        uses: kanade0404/slatify@49d087e4b74ccac7a1f12db94932cb87f7e759a9 # v1.0.0
        if: always()
        with:
          type: ${{ job.status }}
          username: ${{ github.workflow }}
          icon_emoji: ':github:'
          job_name: '*Terraform (Grafana) Plan Result*'
          url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ secrets.SLACK_CHANNEL }}
