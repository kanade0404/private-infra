version: "3.8"
services:
  grafana_infra:
    container_name: grafana_infra
    image: hashicorp/terraform:1.11.4
    working_dir: /grafana-infra
    tty: true
    entrypoint: sh
    volumes:
      - .:/grafana-infra:cached
      # GCS backend への認証には gcloud ADC (Application Default Credentials) を使う。
      # ホスト側で `gcloud auth application-default login` 済みの ADC ファイル 1 つだけを
      # read-only でマウントする。`~/.config/gcloud` ディレクトリ全体をマウントすると
      # GCS backend に不要な他の認証情報（他プロジェクトの認証情報等）まで
      # コンテナに露出してしまうため、必要な ADC ファイルのみに絞る。
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/application_default_credentials.json:cached,ro
    environment:
      HOME: "/root"
      # ADC ファイルの場所を terraform (google provider) に明示的に伝える。
      GOOGLE_APPLICATION_CREDENTIALS: "/tmp/application_default_credentials.json"
      # GRAFANA_URL / GRAFANA_AUTH は CI では GitHub Secrets、ローカルでは
      # シェルで export してから `docker compose up` することで供給する。
      GRAFANA_URL: "${GRAFANA_URL}"
      GRAFANA_AUTH: "${GRAFANA_AUTH}"
