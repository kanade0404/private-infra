version: "3.8"
services:
  grafana_infra:
    container_name: grafana_infra
    image: hashicorp/terraform:1.11.4
    working_dir: /grafana-infra
    tty: true
    entrypoint: sh
    volumes:
      - .:/grafana-infra:cached
      # terraform login の認証情報 (~/.terraform.d/credentials.tfrc.json) を
      # リポジトリのbind mount配下ではなく named volume に保存する。
      - grafana_terraform_home:/root
    environment:
      HOME: "/root"
      # GRAFANA_URL / GRAFANA_AUTH は TFC workspace の env 変数から供給される想定。
      # ローカルで plan/apply する場合はシェルで export してから `docker compose up` すること。
      GRAFANA_URL: "${GRAFANA_URL}"
      GRAFANA_AUTH: "${GRAFANA_AUTH}"
volumes:
  grafana_terraform_home:
